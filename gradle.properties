# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
kotlin.code.style=official
android.useAndroidX=true

# AGP 8.7.3 has only been tested up to compileSdk = 35; this silences the "untested
# compileSdk" warning for compileSdk = 36 without bumping AGP (a bigger, riskier change).
android.suppressUnsupportedCompileSdk=36

# Para un dispositivo físico, usa la IP LAN de la computadora donde corre la API.
# Si usas emulador Android y la API corre en la misma computadora, usa http://10.0.2.2:8080/
BASE_URL=http://192.168.1.145:8080/
